<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CaseFlow Dev Console Form</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#050713;color:#f3f4ff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif} main{width:min(720px,calc(100% - 24px));margin:0 auto;padding:24px 0 48px}.card{border:1px solid rgba(210,214,255,.2);background:#10152f;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 18px 60px rgba(0,0,0,.35)}h1{font-size:30px;line-height:1;margin:6px 0 10px}.kicker{color:#f3d48b;font-size:12px;letter-spacing:.18em}.lead,.small{color:#aeb5dc;line-height:1.7}.small{font-size:13px}label{display:block;color:#aeb5dc;font-size:13px;margin:0 0 12px}input,textarea,select{width:100%;margin-top:6px;border:1px solid rgba(210,214,255,.22);border-radius:14px;background:rgba(0,0,0,.25);color:#f3f4ff;padding:13px;font-size:16px}textarea{min-height:140px;line-height:1.6}button{width:100%;min-height:58px;border:0;border-radius:16px;margin:10px 0;padding:14px 16px;background:linear-gradient(135deg,#9b7cff,#5f7cff);color:#fff;font-size:17px;font-weight:800}.secondary{background:rgba(255,255,255,.1);border:1px solid rgba(210,214,255,.22)}code{color:#80e5ff}iframe{width:100%;height:420px;border:1px solid rgba(210,214,255,.22);border-radius:16px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <section class="card">
    <div class="kicker">CASEFLOW STUDIO™ / NO-JS FORM</div>
    <h1>Dev Console Form</h1>
    <p class="lead">JavaScriptを使わない確認用ページです。ボタンが反応しない場合でも、ブラウザ標準のフォーム送信でHealth確認できます。</p>
    <p class="small">送信結果は下のResult欄にJSONで表示されます。</p>
  </section>

  <section class="card">
    <h2>1. Health / 接続確認</h2>
    <form method="post" action="/api/dev-agent" target="resultFrame">
      <input type="hidden" name="action" value="health" />
      <label>Admin key / 管理者キー<input name="adminKey" type="password" autocomplete="off" placeholder="CASEFLOW_DEV_CONSOLE_KEY" required /></label>
      <label>Repository<input name="repo" value="eternidad475/luks-professional" /></label>
      <label>Base branch<input name="baseBranch" value="claude/image-morphing-video-3kujgb" /></label>
      <label>Working branch<input name="branch" value="chatgpt/dev-console-work" /></label>
      <button type="submit">Health / 接続確認</button>
    </form>
    <p class="small">成功すれば <code>"ok": true</code>、<code>"gemini": true</code>、<code>"githubToken": true</code> などが表示されます。</p>
  </section>

  <section class="card">
    <h2>2. Chat Dry-run / チャット相談</h2>
    <form method="post" action="/api/dev-agent" target="resultFrame">
      <input type="hidden" name="action" value="chat" />
      <input type="hidden" name="apply" value="false" />
      <label>Admin key / 管理者キー<input name="adminKey" type="password" autocomplete="off" placeholder="CASEFLOW_DEV_CONSOLE_KEY" required /></label>
      <label>Repository<input name="repo" value="eternidad475/luks-professional" /></label>
      <label>Base branch<input name="baseBranch" value="claude/image-morphing-video-3kujgb" /></label>
      <label>Working branch<input name="branch" value="chatgpt/dev-console-work" /></label>
      <label>File paths / 読むファイル<textarea name="paths">caseflow_studio_v96.html</textarea></label>
      <label>Request / 依頼内容<textarea name="prompt" placeholder="例：Visual Simulation Studioで保存後に戻るとMorphing Studioへ移動してしまう原因を調査してください。まずコードは変更せず、原因候補と修正方針だけ出してください。"></textarea></label>
      <button type="submit">Send Dry-run / 提案のみ送信</button>
    </form>
  </section>

  <section class="card">
    <h2>3. Read / Compare</h2>
    <div class="row">
      <form method="post" action="/api/dev-agent" target="resultFrame">
        <input type="hidden" name="action" value="read_file" />
        <label>Admin key<input name="adminKey" type="password" required /></label>
        <label>Path<input name="path" value="caseflow_studio_v96.html" /></label>
        <label>Repository<input name="repo" value="eternidad475/luks-professional" /></label>
        <label>Base branch<input name="baseBranch" value="claude/image-morphing-video-3kujgb" /></label>
        <button class="secondary" type="submit">Read file</button>
      </form>
      <form method="post" action="/api/dev-agent" target="resultFrame">
        <input type="hidden" name="action" value="compare" />
        <label>Admin key<input name="adminKey" type="password" required /></label>
        <label>Repository<input name="repo" value="eternidad475/luks-professional" /></label>
        <label>Base branch<input name="baseBranch" value="claude/image-morphing-video-3kujgb" /></label>
        <label>Working branch<input name="branch" value="chatgpt/dev-console-work" /></label>
        <button class="secondary" type="submit">Compare</button>
      </form>
    </div>
  </section>

  <section class="card">
    <h2>Result / 結果</h2>
    <iframe name="resultFrame" title="Dev Console Result"></iframe>
  </section>
</main>
</body>
</html>
