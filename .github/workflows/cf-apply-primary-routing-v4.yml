name: Apply primary routing isolation v4

on:
  push:
    branches:
      - chatgpt/fix-primary-morph-overlay-and-routing
    paths:
      - .github/workflows/cf-apply-primary-routing-v4.yml
      - scripts/cf_primary_routing_v4.py
      - scripts/v4_produce_block.txt
      - scripts/v4_transition_block.txt
      - scripts/v4_isolation_guard.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-primary-morph-overlay-and-routing
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply and validate routing fix
        run: python3 scripts/cf_primary_routing_v4.py
      - name: Commit implementation
        run: |
          git config user.name "caseflow-primary-routing"
          git config user.email "actions@users.noreply.github.com"
          git add caseflow_studio_v96.html sw.js docs/primary-routing-v4-result.txt
          git commit -m "fix(simulation): isolate primary routing and paint result before background work" || exit 0
          git push origin HEAD:chatgpt/fix-primary-morph-overlay-and-routing
