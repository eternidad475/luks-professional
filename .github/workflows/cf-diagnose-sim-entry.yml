name: Diagnose Visual Simulation entry

on:
  push:
    branches:
      - chatgpt/fix-visual-simulation-entry

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Static script syntax audit
        run: |
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          p=Path('caseflow_studio_v96.html')
          s=p.read_text(encoding='utf-8')
          print('HTML bytes',p.stat().st_size,'lines',s.count('\n')+1)
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          print('inline blocks',len(blocks))
          failures=[]
          for i,b in enumerate(blocks):
              f=Path('/tmp')/f'cf_inline_{i}.js'; f.write_text(b,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],text=True,capture_output=True)
              if r.returncode:
                  failures.append((i,r.stderr[-1200:]))
          print('syntax failures',len(failures))
          for i,msg in failures: print('BLOCK',i,msg)
          if failures: raise SystemExit(1)
          PY
      - name: Install browser
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Write entry smoke test
        run: |
          cat > /tmp/cf-entry-smoke.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[]; const logs=[];
            page.on('pageerror',e=>errors.push('PAGEERROR '+e.stack));
            page.on('console',m=>{ if(['error','warning'].includes(m.type())) logs.push(m.type().toUpperCase()+' '+m.text()); });
            await page.addInitScript(()=>{
              localStorage.setItem('caseflow_consent_v96','1');
              localStorage.setItem('caseflow_consent_accepted','true');
              window.supabase={createClient:()=>({
                auth:{getSession:async()=>({data:{session:{user:{id:'smoke-user',email:'smoke@example.com'}}}}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}})},
                from:()=>({select(){return this},eq(){return this},order(){return this},limit(){return this},single:async()=>({data:null,error:null}),maybeSingle:async()=>({data:null,error:null}),insert:async()=>({data:null,error:null}),update(){return this},delete(){return this}}),
                rpc:async()=>({data:null,error:null})
              })};
            });
            await page.route('https://cdn.jsdelivr.net/**',r=>r.fulfill({status:200,contentType:'application/javascript',body:''}));
            await page.route('https://fonts.googleapis.com/**',r=>r.fulfill({status:200,contentType:'text/css',body:''}));
            await page.goto('http://127.0.0.1:4173/caseflow_studio_v96.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(2500);
            const snapshot=await page.evaluate(()=>{
              const screens=[...document.querySelectorAll('.screen')].map(x=>({id:x.id,active:x.classList.contains('active'),display:getComputedStyle(x).display,hidden:x.hidden}));
              const candidates=[...document.querySelectorAll('button,a,[role="button"]')].filter(x=>/visual simulation|ビジュアルシミュレーション/i.test((x.textContent||'').trim())).map((x,i)=>({i,tag:x.tagName,id:x.id,cls:x.className,text:(x.textContent||'').trim().slice(0,160),onclick:x.getAttribute('onclick')}));
              return {readyState:document.readyState,screens,candidates,bodyText:(document.body.innerText||'').slice(0,2500),href:location.href};
            });
            console.log('SNAPSHOT',JSON.stringify(snapshot,null,2));
            let clicked=false;
            const loc=page.getByText(/Visual Simulation Studio|ビジュアルシミュレーション/i).first();
            if(await loc.count()){
              try{await loc.click({timeout:5000});clicked=true;}catch(e){console.log('TEXT CLICK FAILED',e.message);}
            }
            if(!clicked){
              const cand=page.locator('button,a,[role="button"]').filter({hasText:/Visual Simulation|ビジュアルシミュレーション/i}).first();
              if(await cand.count()){try{await cand.click({timeout:5000});clicked=true;}catch(e){console.log('CONTROL CLICK FAILED',e.message);}}
            }
            await page.waitForTimeout(2500);
            const after=await page.evaluate(()=>({
              active:[...document.querySelectorAll('.screen.active')].map(x=>x.id),
              visibleHeadings:[...document.querySelectorAll('h1,h2,h3')].filter(x=>{const s=getComputedStyle(x);const r=x.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width&&r.height}).map(x=>(x.textContent||'').trim()).slice(0,40),
              waitShown:!!document.querySelector('.cfWaitOverlay.show'),
              bodyText:(document.body.innerText||'').slice(0,2500)
            }));
            console.log('CLICKED',clicked);
            console.log('AFTER',JSON.stringify(after,null,2));
            console.log('PAGE_ERRORS',JSON.stringify(errors,null,2));
            console.log('CONSOLE_ERRORS',JSON.stringify(logs.slice(0,50),null,2));
            await page.screenshot({path:'/tmp/cf-entry.png',fullPage:true});
            if(errors.length) process.exitCode=2;
            if(!clicked) process.exitCode=3;
            if(!after.active.some(id=>/sim|visual/i.test(id)) && !after.visibleHeadings.some(t=>/visual simulation|シミュレーション/i.test(t))) process.exitCode=4;
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Start app and run smoke test
        run: |
          python3 -m http.server 4173 >/tmp/cf-http.log 2>&1 &
          node /tmp/cf-entry-smoke.js
