name: Assemble Visual Simulation result-first fix

on:
  push:
    branches:
      - chatgpt/fix-visual-simulation-entry
  pull_request:
    branches:
      - claude/image-morphing-video-3kujgb

permissions:
  contents: write

concurrency:
  group: visual-result-first-assembly
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preserve patch and test tools
        run: |
          cp tools/apply-result-first-paint.js /tmp/apply-result-first-paint.js
          cp tools/result-first-smoke.js /tmp/result-first-smoke.js
      - name: Rebuild from current Production base
        run: |
          git fetch origin claude/image-morphing-video-3kujgb
          git checkout -B chatgpt/visual-result-first-payload origin/claude/image-morphing-video-3kujgb
          node /tmp/apply-result-first-paint.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('caseflow_studio_v96.html')
          s=p.read_text(encoding='utf-8')
          marker='<script id="cf-result-route-guard-v6">'
          a=s.find(marker)
          if a < 0:
              raise SystemExit('result route guard missing')
          b=s.find('</script>',a)
          if b < 0:
              raise SystemExit('result route guard end missing')
          b += len('</script>')
          block=s[a:b].replace('\n+','\n')
          s=s[:a]+block+s[b:]
          p.write_text(s,encoding='utf-8')
          PY
          mkdir -p docs
          cp /tmp/result-first-smoke.js docs/visual-result-first-smoke.js
      - name: Syntax and deterministic safety audit
        run: |
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          p=Path('caseflow_studio_v96.html')
          s=p.read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          failures=[]
          for i,b in enumerate(blocks):
              f=Path('/tmp')/f'cf_inline_{i}.js'; f.write_text(b,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],text=True,capture_output=True)
              if r.returncode: failures.append((i,r.stderr[-1200:]))
          print('inline scripts',len(blocks),'failures',len(failures))
          for i,msg in failures: print('BLOCK',i,msg)
          if failures: raise SystemExit(1)
          required=['cfPaintPrimaryResult','cfScheduleTempSimSave','cfOpenResultScreen','cf-result-route-guard-v6','cfsw-v6-result-first-paint']
          combined=s+Path('sw.js').read_text(encoding='utf-8')
          for token in required:
              if token not in combined: raise SystemExit('missing '+token)
          forbidden=[
            "setTimeout(()=>{ renderResultImages(); buildEditGrid(); }, 60)",
            "setTimeout(()=>{ renderResultImages(); buildEditGrid(); }, 220)",
            "if(id==='result')renderResult()"
          ]
          for token in forbidden:
              if token in s: raise SystemExit('old critical-path pattern remains: '+token)
          PY
          node --check sw.js
      - name: Install Chromium test runtime outside repository
        run: |
          npm install --prefix /tmp/cfnode --no-save playwright@1.54.1
          /tmp/cfnode/node_modules/.bin/playwright install --with-deps chromium
      - name: Run real-app result-first smoke test
        id: smoke
        env:
          NODE_PATH: /tmp/cfnode/node_modules
        run: |
          python3 -m http.server 4173 >/tmp/cf-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          set +e
          node docs/visual-result-first-smoke.js > /tmp/result-first-output.txt 2>&1
          STATUS=$?
          set -e
          cat /tmp/result-first-output.txt
          exit $STATUS
      - name: Upload result-first diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-result-first-diagnostics
          path: |
            /tmp/result-first-output.txt
            /tmp/cf-http.log
          if-no-files-found: warn
      - name: Commit clean production payload
        run: |
          git config user.name "CaseFlow CI"
          git config user.email "actions@users.noreply.github.com"
          git add caseflow_studio_v96.html sw.js docs/visual-result-first-smoke.js
          git commit -m "fix(simulation): paint primary result before heavy hydration"
          git push --force origin HEAD:chatgpt/visual-result-first-payload