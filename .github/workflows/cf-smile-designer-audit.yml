name: CaseFlow Smile Designer Audit

on:
  push:
    branches:
      - chatgpt/smile-designer-secondary-stage
    paths:
      - .github/workflows/cf-smile-designer-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/smile-designer-secondary-stage
          fetch-depth: 0
      - name: Extract implementation context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('caseflow_studio_v96.html').read_text(encoding='utf-8').splitlines()
          terms=['generateRefinedViaAI','secondaryPrompt','golden proportion','golden ratio','getLipOuterRing','_secondaryRefined','compositeRefinedSoft']
          out=[]
          for term in terms:
            hits=[i for i,l in enumerate(lines) if term.lower() in l.lower()]
            out.append(f'## {term} ({len(hits)} hits)')
            for i in hits[:50]:
              lo=max(0,i-45); hi=min(len(lines),i+100)
              out.append(f'\n### lines {lo+1}-{hi}\n')
              for j in range(lo,hi): out.append(f'{j+1:06d}: {lines[j]}')
          Path('docs/smile-designer-refine-audit.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit audit context
        run: |
          git config user.name "caseflow-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/smile-designer-refine-audit.txt
          git commit -m "chore: capture secondary refinement prompt context" || exit 0
          git push
