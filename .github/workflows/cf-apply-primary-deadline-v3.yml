name: Apply primary generation hard deadline v3

on:
  push:
    branches:
      - chatgpt/primary-generation-hard-deadline-v3
    paths:
      - .github/workflows/cf-apply-primary-deadline-v3.yml
      - scripts/cf_primary_deadline_v3.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/primary-generation-hard-deadline-v3
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply and validate
        run: python3 scripts/cf_primary_deadline_v3.py
      - name: Commit implementation
        run: |
          git config user.name "caseflow-hard-deadline"
          git config user.email "actions@users.noreply.github.com"
          git add caseflow_studio_v96.html sw.js docs/primary-generation-v3-result.txt
          git commit -m "fix(simulation): guarantee primary result within hard deadline" || exit 0
          git push origin HEAD:chatgpt/primary-generation-hard-deadline-v3
