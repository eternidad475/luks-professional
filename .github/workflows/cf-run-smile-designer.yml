name: Smile Designer quality gate

on:
  push:
    branches:
      - claude/image-morphing-video-3kujgb
    paths:
      - .github/workflows/cf-run-smile-designer.yml
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - claude/image-morphing-video-3kujgb

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'chatgpt/smile-designer-secondary-stage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/smile-designer-secondary-stage
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Parse inline scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('caseflow_studio_v96.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          failures=[]
          for i,code in enumerate(scripts):
              if not code.strip() or 'src=' in code[:100]: continue
              p=Path(tempfile.gettempdir())/f'cf-script-{i}.js'
              p.write_text(code,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode: failures.append((i,r.stderr[-500:]))
          if failures:
              print(failures)
              raise SystemExit(1)
          print(f'{len(scripts)} inline scripts parsed')
          PY
      - name: Run real-app Smile Designer smoke suite
        run: node docs/smile-designer-smoke.js caseflow_studio_v96.html
