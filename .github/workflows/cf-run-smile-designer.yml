name: Run Smile Designer branch patch

on:
  push:
    branches:
      - claude/image-morphing-video-3kujgb
    paths:
      - .github/workflows/cf-run-smile-designer.yml
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - claude/image-morphing-video-3kujgb

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'chatgpt/smile-designer-secondary-stage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/smile-designer-secondary-stage
          fetch-depth: 0
      - name: Execute branch patcher and capture diagnostics
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > docs/smile-designer-run.log 2>&1
          from pathlib import Path
          import traceback
          try:
              wf=Path('.github/workflows/cf-smile-designer-implement.yml').read_text(encoding='utf-8')
              marker="python3 - <<'PY'\n"
              start=wf.index(marker)+len(marker)
              end=wf.index("\n          PY", start)
              raw=wf[start:end].splitlines()
              code='\n'.join(line[10:] if line.startswith('          ') else line for line in raw)
              ns={'__name__':'__main__'}
              exec(compile(code,'cf-smile-designer-implement','exec'),ns,ns)
              print('PATCH_OK')
          except Exception:
              traceback.print_exc()
              print('PATCH_FAILED')
          PY
          cat docs/smile-designer-run.log
      - name: Commit diagnostics and implementation when present
        run: |
          git config user.name "caseflow-smile-designer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/smile-designer-run.log
          test -f docs/smile-designer-implementation.md && git add docs/smile-designer-implementation.md || true
          git add caseflow_studio_v96.html
          git commit -m "chore(simulation): run Smile Designer patcher" || exit 0
          git push origin HEAD:chatgpt/smile-designer-secondary-stage
