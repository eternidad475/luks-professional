name: Cleanup primary routing v4 temp files

on:
  push:
    branches:
      - chatgpt/fix-primary-morph-overlay-and-routing
    paths:
      - .github/workflows/cf-cleanup-primary-routing-v4.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-primary-morph-overlay-and-routing
          fetch-depth: 1
      - name: Remove diagnostic and patch scaffolding
        run: |
          rm -f \
            .github/workflows/cf-apply-primary-routing-v4.yml \
            .github/workflows/cf-diag-primary-flow-compact.yml \
            .github/workflows/cf-diag-primary-morph-leak.yml \
            .github/workflows/cf-extract-primary-flow-chunks.yml \
            .github/workflows/cf-extract-primary-postflow.yml \
            .github/workflows/cf-cleanup-primary-routing-v4.yml \
            docs/diag-cfwait-core.txt \
            docs/diag-cfwait-definitions.txt \
            docs/diag-cfwait-i18n-wrapper.txt \
            docs/diag-cfwait-lines.txt \
            docs/diag-go-wrapper.txt \
            docs/diag-morph-hooks.txt \
            docs/diag-poems.txt \
            docs/diag-primary-analysis.txt \
            docs/diag-primary-callsite.txt \
            docs/diag-primary-go-morph.txt \
            docs/diag-primary-result-save.txt \
            docs/diag-wait-overlay-markup.txt \
            docs/diag-wait-overlay.txt \
            docs/primary-flow-compact.txt \
            docs/primary-morph-leak-diagnostics.txt \
            docs/primary-routing-v4-result.txt \
            scripts/cf_diag_primary_flow_compact.py \
            scripts/cf_diag_primary_morph_leak.py \
            scripts/cf_extract_primary_flow_chunks.py \
            scripts/cf_extract_primary_postflow.py \
            scripts/cf_primary_routing_v4.py \
            scripts/v4_isolation_guard.txt \
            scripts/v4_produce_block.txt \
            scripts/v4_transition_block.txt
      - name: Commit cleanup
        run: |
          git config user.name "caseflow-cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove primary routing diagnostic scaffolding" || exit 0
          git push origin HEAD:chatgpt/fix-primary-morph-overlay-and-routing
