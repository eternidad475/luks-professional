      - name: Parse all inline scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          s=Path('caseflow_studio_v96.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,code in enumerate(scripts):
            f=Path('/tmp')/f'cf-script-{i}.js';f.write_text(code,encoding='utf-8')
            r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
            if r.returncode:
              print(i,r.stderr);sys.exit(1)
          print('parsed',len(scripts),'inline scripts')
          PY

      - name: Run real-app Playwright smoke
        run: |
          npm install playwright@1.52.0 --no-save
          npx playwright install chromium
          node docs/smile-designer-secondary-smoke.js caseflow_studio_v96.html

      - name: Commit implementation
        run: |
          git config user.name "caseflow-implementation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add caseflow_studio_v96.html docs/smile-designer-secondary-smoke.js
          git commit -m "feat(simulation): move tooth-form design to secondary Smile Designer" || exit 0
          git push
