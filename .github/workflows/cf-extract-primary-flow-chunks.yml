name: Extract primary flow chunks

on:
  push:
    branches:
      - chatgpt/fix-primary-morph-overlay-and-routing
    paths:
      - .github/workflows/cf-extract-primary-flow-chunks.yml
      - scripts/cf_extract_primary_flow_chunks.py

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-primary-morph-overlay-and-routing
          fetch-depth: 1
      - run: python3 scripts/cf_extract_primary_flow_chunks.py
      - run: |
          git config user.name "caseflow-diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git add docs/diag-*.txt
          git commit -m "chore: capture targeted primary flow chunks" || exit 0
          git push origin HEAD:chatgpt/fix-primary-morph-overlay-and-routing
