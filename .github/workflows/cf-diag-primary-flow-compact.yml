name: Diagnose primary flow compact

on:
  push:
    branches:
      - chatgpt/fix-primary-morph-overlay-and-routing
    paths:
      - .github/workflows/cf-diag-primary-flow-compact.yml
      - scripts/cf_diag_primary_flow_compact.py

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-primary-morph-overlay-and-routing
          fetch-depth: 1
      - run: python3 scripts/cf_diag_primary_flow_compact.py
      - run: |
          git config user.name "caseflow-diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git add docs/primary-flow-compact.txt
          git commit -m "chore: capture compact primary flow diagnostics" || exit 0
          git push origin HEAD:chatgpt/fix-primary-morph-overlay-and-routing
