name: Assemble primary routing v4 final

on:
  push:
    branches:
      - chatgpt/primary-routing-v4-final
  pull_request:
    branches:
      - claude/image-morphing-video-3kujgb

permissions:
  contents: write

concurrency:
  group: primary-routing-v4-final-assembly
  cancel-in-progress: true

jobs:
  assemble:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'chatgpt/primary-routing-v4-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/primary-routing-v4-final
          fetch-depth: 0
      - name: Fetch source and current production base
        run: |
          git fetch origin chatgpt/fix-primary-morph-overlay-and-routing
          git fetch origin claude/image-morphing-video-3kujgb
      - name: Copy validated implementation
        run: |
          git show origin/chatgpt/fix-primary-morph-overlay-and-routing:caseflow_studio_v96.html > caseflow_studio_v96.html
          git show origin/chatgpt/fix-primary-morph-overlay-and-routing:sw.js > sw.js
          mkdir -p docs scripts
          git show origin/chatgpt/fix-primary-morph-overlay-and-routing:docs/primary-routing-v4-smoke.js > docs/primary-routing-v4-smoke.js
      - name: Apply reviewer fixes
        run: python3 scripts/cf_assemble_primary_routing_v4_final.py
      - name: Deterministic syntax and routing validation
        run: |
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          s=Path('caseflow_studio_v96.html').read_text(encoding='utf-8')
          assert 'Preparing morphing sequence' not in s
          assert 'モーフィングシークエンスを準備中' not in s
          assert 'const CF_PRIMARY_RESULT_DEADLINE_MS=16000' in s
          assert 'cfCheckPrimaryRun(runCtx);\n            const arr=Array.isArray(j)' not in s
          assert 'requestAnimationFrame(()=>requestAnimationFrame(ensureResult))' in s
          assert 'cfsw-v4-primary-routing' in Path('sw.js').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          for i,b in enumerate(blocks):
              p=Path('/tmp')/f'cf_inline_{i}.js'; p.write_text(b,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True,stdout=subprocess.DEVNULL)
          subprocess.run(['node','--check','sw.js'],check=True)
          print('validated inline scripts:',len(blocks))
          PY
      - name: Prepare payload worktree
        run: |
          cp caseflow_studio_v96.html /tmp/caseflow_studio_v96.html
          cp sw.js /tmp/sw.js
          cp docs/primary-routing-v4-smoke.js /tmp/primary-routing-v4-smoke.js
          git checkout -f -B chatgpt/primary-routing-v4-payload origin/claude/image-morphing-video-3kujgb
          cp /tmp/caseflow_studio_v96.html caseflow_studio_v96.html
          cp /tmp/sw.js sw.js
          mkdir -p docs
          cp /tmp/primary-routing-v4-smoke.js docs/primary-routing-v4-smoke.js
          git status --short
      - name: Commit payload
        run: |
          git config user.name "caseflow-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add caseflow_studio_v96.html sw.js docs/primary-routing-v4-smoke.js
          git diff --cached --stat
          git commit -m "fix(simulation): isolate primary generation and paint result first"
      - name: Push payload branch
        run: git push --force origin HEAD:chatgpt/primary-routing-v4-payload
