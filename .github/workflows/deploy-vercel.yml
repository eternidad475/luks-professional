name: Deploy to Vercel (Production)

on:
  push:
    branches: [claude/image-morphing-video-3kujgb]
    paths:
      - '**.html'
      - 'vercel.json'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel (Production)
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel deploy --prod --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID" 2>&1 | tee /tmp/vercel_deploy.log
          URL=$(grep -oP 'https://[^\s]+vercel\.app[^\s]*' /tmp/vercel_deploy.log | tail -1)
          echo "## ✅ Vercel Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $URL" >> $GITHUB_STEP_SUMMARY
