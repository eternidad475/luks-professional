name: Extract primary postflow diagnostics

on:
  push:
    branches:
      - chatgpt/fix-primary-morph-overlay-and-routing
    paths:
      - .github/workflows/cf-extract-primary-postflow.yml
      - scripts/cf_extract_primary_postflow.py

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-primary-morph-overlay-and-routing
          fetch-depth: 1
      - run: python3 scripts/cf_extract_primary_postflow.py
      - run: |
          git config user.name "caseflow-diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git add docs/diag-primary-analysis.txt docs/diag-primary-result-save.txt docs/diag-primary-go-morph.txt
          git commit -m "chore: capture primary postflow diagnostics" || exit 0
          git push origin HEAD:chatgpt/fix-primary-morph-overlay-and-routing
