name: Diagnose primary morph leak

on:
  push:
    branches:
      - chatgpt/fix-primary-morph-overlay-and-routing
    paths:
      - .github/workflows/cf-diag-primary-morph-leak.yml
      - scripts/cf_diag_primary_morph_leak.py

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-primary-morph-overlay-and-routing
          fetch-depth: 1
      - name: Extract diagnostics
        run: python3 scripts/cf_diag_primary_morph_leak.py
      - name: Commit diagnostics
        run: |
          git config user.name "caseflow-diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git add docs/primary-morph-leak-diagnostics.txt
          git commit -m "chore: capture primary morph leak diagnostics" || exit 0
          git push origin HEAD:chatgpt/fix-primary-morph-overlay-and-routing
