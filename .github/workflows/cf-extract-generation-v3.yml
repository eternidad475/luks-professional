name: Extract primary generation diagnostics v3

on:
  push:
    branches:
      - chatgpt/primary-generation-hard-deadline-v3
    paths:
      - .github/workflows/cf-extract-generation-v3.yml
      - scripts/cf_extract_generation_v3.py

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/primary-generation-hard-deadline-v3
          fetch-depth: 1
      - name: Extract relevant code
        run: python3 scripts/cf_extract_generation_v3.py
      - name: Commit diagnostics
        run: |
          git config user.name "caseflow-diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git add docs/primary-generation-v3-diagnostics.txt
          git commit -m "chore: capture primary generation v3 diagnostics" || exit 0
          git push origin HEAD:chatgpt/primary-generation-hard-deadline-v3
