<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16b8d6">
<meta name="robots" content="noindex, nofollow">
<title>CaseFlow Studio</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#16b8d6}
body{position:fixed;inset:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
</style>
</head>
<body>
<iframe id="caseflowAppFrame" src="/caseflow_studio_v96.html" title="CaseFlow Studio"></iframe>
<script>
(function(){
  const frame=document.getElementById('caseflowAppFrame');
  const SWAP_LABEL='Color 1 と Color 2 を入れ替える';
  const textOf=el=>(el&&el.textContent||'').replace(/\s+/g,' ').trim();
  const dispatch=el=>{ if(!el)return; el.dispatchEvent(new Event('input',{bubbles:true})); el.dispatchEvent(new Event('change',{bubbles:true})); };
  const docOf=()=>{ try{return frame.contentDocument||frame.contentWindow.document;}catch(e){return null;} };
  function nearestText(el){ let n=el; for(let i=0;n&&i<5;i++,n=n.parentElement){ const t=textOf(n); if(t)return t; } return ''; }
  function ranges(doc){ return Array.from(doc.querySelectorAll('input[type="range"]')); }
  function hueRanges(doc){ const rs=ranges(doc); const hs=rs.filter(r=>/Color\s*1\s*Hue|Color\s*2\s*Hue|Hue/i.test(nearestText(r))); return hs.length>=2?hs.slice(0,2):rs.slice(0,2); }
  function blendRange(doc){ const rs=ranges(doc); return rs.find(r=>/BLEND\s*RATIO|Blend\s*Ratio/i.test(nearestText(r)))||rs[2]||null; }
  function swapVars(doc){ const root=doc.documentElement; const cs=doc.defaultView.getComputedStyle(root); const c1=cs.getPropertyValue('--c1').trim(); const c2=cs.getPropertyValue('--c2').trim(); if(c1&&c2){ root.style.setProperty('--c1',c2); root.style.setProperty('--c2',c1); } }
  function swap(doc){
    const hs=hueRanges(doc);
    if(hs.length>=2){ const v=hs[0].value; hs[0].value=hs[1].value; hs[1].value=v; dispatch(hs[0]); dispatch(hs[1]); } else { swapVars(doc); }
    const br=blendRange(doc);
    if(br&&br.value!==''){ const min=Number(br.min||0), max=Number(br.max||100), cur=Number(br.value); if(Number.isFinite(cur)){ br.value=String(min+max-cur); dispatch(br); } }
    swapVars(doc);
    try{ navigator.vibrate&&navigator.vibrate(10); }catch(e){}
  }
  function decorate(el,doc){
    if(el.dataset.caseflowSwapFixed==='1')return;
    el.dataset.caseflowSwapFixed='1';
    el.setAttribute('aria-label',SWAP_LABEL); el.setAttribute('title',SWAP_LABEL);
    if(el.tagName!=='BUTTON')el.setAttribute('role','button');
    el.style.cursor='pointer'; el.style.fontSize='0'; el.style.lineHeight='0'; el.style.userSelect='none'; el.style.webkitUserSelect='none';
    Array.from(el.childNodes).forEach(n=>{ if(n.nodeType===Node.TEXT_NODE&&n.textContent.includes('⇄')) n.textContent=''; });
    if(textOf(el)==='⇄')el.textContent='';
    el.addEventListener('click',ev=>{ ev.preventDefault(); ev.stopPropagation(); swap(doc); el.animate([{transform:'rotate(0deg)'},{transform:'rotate(180deg)'}],{duration:220,easing:'cubic-bezier(.2,.8,.2,1)'}); },true);
  }
  function install(doc){
    if(!doc)return;
    Array.from(doc.querySelectorAll('button,[role="button"],.iconbtn,.switch,.swap,*')).filter(el=>textOf(el).includes('⇄')).forEach(el=>decorate(el,doc));
  }
  frame.addEventListener('load',()=>{ const doc=docOf(); if(!doc)return; install(doc); new MutationObserver(()=>install(doc)).observe(doc.documentElement,{childList:true,subtree:true,characterData:true}); });
})();
</script>
</body>
</html>
